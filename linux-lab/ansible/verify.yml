---
- name: Verify Ubuntu Packer VM (read-only starter)
  hosts: packer_ubuntu
  gather_facts: true
  become: false
  tasks:
    - name: Confirm installed distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_major_version'] == '22'
        fail_msg: 'This check expects Ubuntu 22.04; update it if using another release.'

    - name: Display target and kernel
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ ansible_facts['distribution_version'] }} kernel {{ ansible_facts['kernel'] }}"
